services:
  - type: web
    name: finsight-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://your-frontend-url.vercel.app # TODO: Replace with your actual frontend URL
      - key: MONGO_URI
        sync: false # You must set this manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      # Add RESEND_API_KEY or SMTP variables manually in the dashboard
